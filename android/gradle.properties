org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Added by project setup: do not let AGP silently download GB-scale SDK components;
# install what is needed explicitly instead (see docs/dev-notes.md).
android.builder.sdkDownload=false

# Kotlin incremental compilation intermittently fails on this Windows setup with
# "Could not close incremental caches in .../caches-jvm/..." (no filesystem error
# attached - the cache files simply cannot be closed). Disabling it and running the
# compiler inside the Gradle process avoids that code path entirely.
# Slower incremental builds, but deterministic. See docs/dev-notes.md.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
